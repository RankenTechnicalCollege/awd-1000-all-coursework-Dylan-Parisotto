<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Challenge 2 - Todo App</title>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
		crossorigin="anonymous"
	>
  <script src="challenge2.js" defer></script>
</head>
<body class="bg-light">
	<main class="container py-5">
		<div class="row justify-content-center">
			<div class="col-12 col-md-10 col-lg-8">
				<div class="card shadow-sm border-0">
					<div class="card-body p-4 p-md-5">
						<h1 class="h3 mb-4">Todo App</h1>

						<form id="todoForm" class="row g-2" novalidate>
							<div class="col-12 col-md-9">
								<label for="taskInput" class="form-label">New Task</label>
								<input
									id="taskInput"
									type="text"
									class="form-control"
									placeholder="Enter a task"
									aria-describedby="taskFeedback"
								>
								<div id="taskFeedback" class="invalid-feedback">
									Task cannot be blank.
								</div>
							</div>
							<div class="col-12 col-md-3 d-grid align-content-end">
								<button type="submit" class="btn btn-primary mt-md-4">Add Task</button>
							</div>
						</form>

						<hr class="my-4">

						<h2 class="h5">Tasks</h2>
						<ul id="todoList" class="list-group"></ul>
					</div>
				</div>
			</div>
		</div>
	</main>

</body>
</html>
