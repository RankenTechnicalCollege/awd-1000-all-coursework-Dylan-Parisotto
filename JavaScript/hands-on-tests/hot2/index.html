<!DOCTYPE html>
<html>
<head>
   <!--
      JavaScript

      Author: 
      Date:   

      Filename: index.htm
   -->
   <meta charset="utf-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
   <title>Hands-on Project 7-3</title>
   <link rel="stylesheet" href="styles.css" />
   <script src="modernizr.custom.05819.js" defer></script>
</head>

<body>
   <header>
      <h1>
         Hands-on Test Chapter 4
      </h1>
   </header>

   <article>
      <h2>Steam Game Sale</h2>
      <form>
         <input type="checkbox" id="item1" value="1999" />
         <label for="item1">Counter Strike ($19.99)</label>
         <input type="checkbox" id="item2" value="2999" />
         <label for="item2">Dark Souls III ($29.99)</label>
         <input type="checkbox" id="item3" value="1349" />
         <label for="item3">Enter The Gungeon ($13.49)</label>
         <input type="checkbox" id="item4" value="499" />
         <label for="item4">Hover Junkers ($4.99)</label>
         <input type="checkbox" id="item5" value="899" />
         <label for="item5">Good Robot ($8.99)</label>
         <br>
         <button type="button" value="Calculate" id="sButton">Calculate</button>
      </form>
      <table>
         <colgroup>
            <col class="label" />
            <col class="amount" />
         </colgroup>
         <tbody>
            <tr>
               <td>Item total</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Tax</td>
               <td>0.00</td>
            </tr>
            <tr>
               <td>Total with tax</td>
               <td>$0.00</td>
            </tr>
         </tbody>
      </table>
   </article>
   <script>
      "use strict";
      // Fixed issues:
      // 1. The submit button click event is correctly attached to the button element.
      // 2. The game prices are stored as whole cents and match the displayed prices.
      // 3. Tax is calculated from the selected item total.
      // 4. Total with tax is calculated using item total + tax.
      // 5. Only the real checkbox inputs are counted when summing selected items.
      // 6. Each checked game adds its value to the running total correctly.

      function calcTotal() {
         var itemTotal = 0;
         var taxRate = 0.10;
         var tax = 0;
         var totalWithTax = 0;
         var items = document.querySelectorAll("input[type='checkbox']");
         var cells = document.getElementsByTagName("td");

         for (var i = 0; i < items.length; i++) {
            if (items[i].checked) {
               itemTotal += Number(items[i].value);
            }
         }

         tax = itemTotal * taxRate;
         totalWithTax = itemTotal + tax;

         cells[1].textContent = (itemTotal / 100).toFixed(2);
         cells[3].textContent = (tax / 100).toFixed(2);
         cells[5].textContent = "$" + (totalWithTax / 100).toFixed(2);

         for (var j = 0; j < items.length; j++) {
            items[j].checked = false;
         }
      }

      var date = new Date();
      var dayNames = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
      var monthNames = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      var formattedDate = dayNames[date.getDay()] + " " + monthNames[date.getMonth()] + " " + date.getDate() + " " + date.getFullYear();

      var dateDiv = document.createElement("div");
      dateDiv.textContent = formattedDate;
      document.body.appendChild(dateDiv);

      var submitButton = document.getElementById("sButton");
      if (submitButton) {
         submitButton.addEventListener("click", calcTotal);
      }
   </script>
</body>
</html>
